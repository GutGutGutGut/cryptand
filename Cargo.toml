[package]
name = "cryptand"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
aes-gcm = "0.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.8"
